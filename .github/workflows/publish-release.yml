name: Build and publish Windows release

on:
  push:
    branches: [main]
    paths: [release/version.json]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - name: Build and test
        shell: pwsh
        run: |
          # Media Foundation encode tests run on a Windows desktop locally;
          # hosted Windows Server images need not provide that optional codec.
          dotnet test tests/GeometryGrid.Tests/GeometryGrid.Tests.csproj -c Release --filter "FullyQualifiedName!~VideoExport" --logger "trx;LogFileName=release-tests.trx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable ZIP and checksum
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -SkipTests
      - name: Publish release and assets
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const info = JSON.parse(fs.readFileSync('release/version.json', 'utf8'));
            if (!/^\d+\.\d+(?:\.\d+)?$/.test(info.version)) throw new Error('Invalid release version');
            const tag = `v${info.version}`;
            const owner = context.repo.owner, repo = context.repo.repo;
            const body = fs.readFileSync('release/notes.md', 'utf8');
            let release;
            try {
              ({data: release} = await github.rest.repos.getReleaseByTag({owner, repo, tag}));
              if (release.target_commitish !== context.sha) throw new Error('Existing release points to a different commit; refusing to overwrite');
            } catch (error) {
              if (error.status !== 404) throw error;
              ({data: release} = await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: `GeometryGrid ${tag}`, body, draft: false, prerelease: false,
                make_latest: 'true'
              }));
            }
            const folder = path.join('artifacts', 'releases', tag);
            for (const name of [`GeometryGrid-v.${info.version}-win-x64.zip`, 'SHA256SUMS.txt']) {
              const file = path.join(folder, name);
              const existing = release.assets.find(asset => asset.name === name);
              if (existing) {
                const digest = `sha256:${require('crypto').createHash('sha256').update(fs.readFileSync(file)).digest('hex')}`;
                if (existing.digest !== digest) throw new Error(`Existing asset ${name} differs; refusing to replace`);
                continue;
              }
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name,
                data: fs.readFileSync(file),
                headers: {'content-type': name.endsWith('.zip') ? 'application/zip' : 'text/plain', 'content-length': fs.statSync(file).size}
              });
            }
            core.notice(`Published ${release.html_url}`);
