<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src data: blob:; script-src 'self'; style-src 'unsafe-inline';">
  <title>GeometryGrid Liquid Glass</title>
  <style>
    html, body, canvas {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    html, body {
      background:
        radial-gradient(circle at 8% 8%, rgba(114,167,255,.72), transparent 31%),
        radial-gradient(circle at 90% 31%, rgba(173,136,255,.54), transparent 38%),
        radial-gradient(circle at 49% 102%, rgba(99,220,232,.48), transparent 40%),
        linear-gradient(135deg, #eef5ff 0%, #f8f7ff 46%, #e9f8ff 100%);
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="liquid-glass" aria-hidden="true"></canvas>
  <script src="liquid-glass-runtime.js"></script>
</body>
</html>
